<!DOCTYPE html>

<head>

  <style>
    .button-link {
  /* Basic button styling */
  display: inline-block; /* Allows padding and margin to be applied */
  padding: 10px 20px;
  background-color: #007bff; /* Blue background */
  color: white; /* White text */
  text-decoration: none; /* Removes default underline from links */
  border: 1px solid #0056b3;
  border-radius: 5px;
  cursor: pointer; /* Ensures the cursor is a pointer (hand) on hover */
  text-align: center;
}

.button-link:hover {
  background-color: #0056b3; /* Darker blue on hover */
}

  </style>
</head>
<body>

        Go to Example

  </div>
</body>
